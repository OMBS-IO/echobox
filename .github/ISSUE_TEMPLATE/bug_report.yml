name: Bug Report
description: Report a bug or unexpected behavior in Echobox
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as possible to help us investigate.

  - type: input
    id: version
    attributes:
      label: Echobox Version
      placeholder: "e.g. 0.1.0-alpha.3"
    validations:
      required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Playback Output
      options:
        - Phone speaker
        - Wired headphones (3.5mm)
        - Bluetooth headphones/speaker
        - USB DAC
        - Chromecast
        - UPnP/DLNA renderer
        - SoundTouch speaker
        - Output group (multi-room)
        - Android Auto
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior

  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: "e.g. Samsung Galaxy S24 Ultra"

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 15"

  - type: textarea
    id: audio-details
    attributes:
      label: Audio Setup Details
      description: "DAC model, headphones, speaker setup, etc."

  - type: textarea
    id: logs
    attributes:
      label: Signal Path / Logs
      description: "If applicable, paste signal path diagnostics from the app"
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording
      description: "Drag and drop images here"
