name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: "What problem does this solve? What are you trying to do?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "Describe the feature or change you'd like to see"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      multiple: true
      options:
        - Playback / Audio Engine
        - DSP / EQ / Effects
        - Library Management
        - UI / UX
        - Multi-room / Streaming
        - Audio Analysis
        - Format Support
        - Android Auto
        - Add-ons
        - Internet Radio
        - Room Correction
        - Accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Have you tried any workarounds or considered other approaches?"
