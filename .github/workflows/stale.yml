name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            if no further activity occurs. If this is still relevant, please comment
            to keep it open.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          exempt-issue-labels: >
            confirmed,
            in-progress,
            planned,
            priority/critical,
            priority/high
          days-before-pr-stale: -1
          days-before-pr-close: -1
