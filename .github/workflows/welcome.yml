name: Welcome New Contributors

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.issue.user.login;
            const repo = context.repo;

            // Check if this is the user's first issue
            const issues = await github.rest.issues.listForRepo({
              ...repo,
              creator: creator,
              state: 'all',
            });

            if (issues.data.length === 1) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: context.issue.number,
                body: `Welcome to the Echobox community, @${creator}! 👋

Thanks for opening your first issue. We read every report and will get back to you as soon as possible.

A few tips:
- **Vote on issues** you care about with a 👍 reaction — it helps us prioritize
- **Join our [Discord](https://discord.gg/XZ3WEFu7)** for quicker back-and-forth
- **Check the [roadmap](https://ombs.io/roadmap)** to see what's planned

Thanks for helping make Echobox better!`
              });
            }
